[project]
name = "pkg-proxy-stress"
version = "0.0.0"
description = "Stress test a PyPI simple proxy with raw HTTP and pip workloads"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "packaging>=25.0",
    "pip>=26.1",
]

[project.scripts]
pkg-proxy-stress = "pkg_proxy_stress.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
